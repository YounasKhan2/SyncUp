name: syncup-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: syncup-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncup
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: syncup
    ports:
      - "127.0.0.1:54331:5432"
    volumes:
      - syncup_dev_pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncup -d syncup"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: syncup-dev-livekit
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

volumes:
  syncup_dev_pgdata:
    name: syncup_dev_pgdata
